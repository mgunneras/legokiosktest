<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<title>Brick Kiosk</title>
<link rel="stylesheet" href="src/style.css" />
</head>
<body>
  <div id="app">
    <aside id="menu">
      <header id="menuHead">
        <h1>BRICKS</h1>
        <button id="btnEye" aria-label="Head tracking" title="Head tracking">
          <svg viewBox="0 0 24 24" width="13" height="13" aria-hidden="true" focusable="false">
            <path d="M1.6 12S5.5 5.5 12 5.5 22.4 12 22.4 12 18.5 18.5 12 18.5 1.6 12 1.6 12Z"
                  fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>
            <circle cx="12" cy="12" r="2.8" fill="currentColor"/>
          </svg>
        </button>
        <button id="btnKey" aria-label="Gemini API key" title="Gemini API key">
          <svg viewBox="0 0 24 24" width="12" height="12" aria-hidden="true" focusable="false">
            <circle cx="8.5" cy="8.5" r="4.2" fill="none" stroke="currentColor" stroke-width="2"/>
            <path d="M11.6 11.6 19 19M15.4 15.4l1.8-1.8M18 18l1.6-1.6"
                  fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          </svg>
        </button>
        <p id="hint">drag a brick onto the plate.<br>drop bricks on bricks to build up.<br>push the board about with one finger.<br>two fingers to turn and zoom it.<br>flick as you let go to throw it.</p>
      </header>
      <div id="palette"></div>
      <div id="pageBar">
        <button class="tool" id="btnShuffle">SHUFFLE</button>
        <button class="tool" id="btnColours">COLOURS</button>
      </div>
      <div id="aiGroup">
        <span id="aiLabel">GEMINI</span>
        <button class="tool ai" id="btnHint">WHAT NEXT?</button>
      </div>
      <footer id="menuFoot">
        <button class="tool" id="btnUndo">UNDO</button>
        <button class="tool" id="btnClear">CLEAR</button>
        <button class="tool" id="btnHome">RESET VIEW</button>
        <button class="tool" id="btnFull">FULLSCREEN</button>
      </footer>
    </aside>
    <main id="stage">
      <canvas id="gl"></canvas>
      <div id="stats"></div>
    </main>
  </div>
  <div id="chips"></div>
  <div id="bubbles"></div>
  <div id="debug" hidden>
    <form id="debugPanel" autocomplete="off">
      <h3>GEMINI</h3>
      <label for="apiKey">API key</label>
      <input id="apiKey" type="password" autocomplete="off" spellcheck="false"
             placeholder="paste your key" />
      <label for="modelSel">Model</label>
      <select id="modelSel"><option value="">add a key to load models</option></select>
      <p id="debugNote">Stored in this browser only.</p>
      <div class="debugRow">
        <button class="tool" type="submit" id="btnKeySave">SAVE</button>
        <button class="tool" type="button" id="btnKeyClose">CLOSE</button>
      </div>

      <h3 class="sep">HEAD TRACKING <em>experimental</em></h3>
      <label class="check"><input type="checkbox" id="headOn" />watch me through the front camera</label>
      <div id="headBox">
        <canvas id="headView" width="160" height="120"></canvas>
        <div id="headOut">&#8212;</div>
      </div>
      <p id="headNote"></p>
      <div class="knob"><label for="hTilt">lean up / down <b id="hTiltV"></b></label>
        <input type="range" id="hTilt" min="0" max="200" step="5" /></div>
      <div class="knob"><label for="hTurn">lean left / right <b id="hTurnV"></b></label>
        <input type="range" id="hTurn" min="0" max="90" step="2" /></div>
      <div class="knob"><label for="hZoom">lean in / out <b id="hZoomV"></b></label>
        <input type="range" id="hZoom" min="0" max="100" step="5" /></div>
      <div class="knob"><label for="hEase">response <b id="hEaseV"></b></label>
        <input type="range" id="hEase" min="5" max="100" step="5" /></div>
      <label class="check"><input type="checkbox" id="headMirror" />mirror the reading</label>
      <div class="debugRow">
        <button class="tool" type="button" id="btnHeadZero">CENTRE ME</button>
        <button class="tool" type="button" id="btnHeadSpin">TURN INPUT</button>
      </div>
    </form>
  </div>
  <div id="start"><div>
    <h2>BRICK KIOSK</h2>
    <p>tap anywhere to begin</p>
  </div></div>
  <script type="module" src="src/main.js"></script>
</body>
</html>
