<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<title>Brick Kiosk</title>
<link rel="stylesheet" href="src/style.css" />
</head>
<body>
  <div id="app">
    <aside id="menu">
      <header id="menuHead">
        <h1>BRICKS</h1>
        <button id="btnKey" aria-label="Gemini API key" title="Gemini API key">
          <svg viewBox="0 0 24 24" width="12" height="12" aria-hidden="true" focusable="false">
            <circle cx="8.5" cy="8.5" r="4.2" fill="none" stroke="currentColor" stroke-width="2"/>
            <path d="M11.6 11.6 19 19M15.4 15.4l1.8-1.8M18 18l1.6-1.6"
                  fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          </svg>
        </button>
        <p id="hint">drag a brick onto the plate.<br>drop bricks on bricks to build up.<br>spin the plate to turn it 90&#176;<br>flick as you let go to throw it.</p>
      </header>
      <div id="palette"></div>
      <div id="pageBar">
        <button class="tool" id="btnPage">MORE BRICKS <span id="pageState">BRICKS 1/3</span></button>
      </div>
      <div id="aiGroup">
        <span id="aiLabel">GEMINI</span>
        <button class="tool ai" id="btnDescribe">WHAT IS THIS?</button>
        <button class="tool ai" id="btnHint">WHAT NEXT?</button>
      </div>
      <footer id="menuFoot">
        <button class="tool" id="btnUndo">UNDO</button>
        <button class="tool" id="btnClear">CLEAR</button>
        <button class="tool" id="btnHome">RESET VIEW</button>
        <button class="tool" id="btnFull">FULLSCREEN</button>
      </footer>
    </aside>
    <main id="stage">
      <canvas id="gl"></canvas>
      <div id="stats"></div>
    </main>
  </div>
  <div id="chips"></div>
  <div id="bubble" hidden><span id="bubbleText"></span></div>
  <div id="debug" hidden>
    <form id="debugPanel" autocomplete="off">
      <h3>GEMINI</h3>
      <label for="apiKey">API key</label>
      <input id="apiKey" type="password" autocomplete="off" spellcheck="false"
             placeholder="paste your key" />
      <label for="modelSel">Model</label>
      <select id="modelSel"><option value="">add a key to load models</option></select>
      <p id="debugNote">Stored in this browser only.</p>
      <div class="debugRow">
        <button class="tool" type="submit" id="btnKeySave">SAVE</button>
        <button class="tool" type="button" id="btnKeyClose">CLOSE</button>
      </div>
    </form>
  </div>
  <div id="start"><div>
    <h2>BRICK KIOSK</h2>
    <p>tap anywhere to begin</p>
  </div></div>
  <script type="module" src="src/main.js"></script>
</body>
</html>
